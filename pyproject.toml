[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu_sls"
version = "0.1.0"
description = "GPU-SLS with Jax"
authors = [{name="Jeffrey Fang"}]
requires-python = ">=3.11"

dependencies = [
    "crazyflow>=0.2.1,<0.3",
    "flax>=0.12.1,<0.12.2",
    "pycddlib",
    "jax[cuda13]==0.8.1",
    "mujoco",
    "mujoco-mjx",
    "gym-quadruped",
    "trajax @ git+https://github.com/google/trajax",
    "numpy",
    "scipy",
    "matplotlib",
    "mpx @ git+https://github.com/iit-DLSLab/mpx.git",
]

[tool.setuptools.packages.find]
where = ["src"]
